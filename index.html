<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content=""/>
  <title>Nishal NM</title>
  <link rel="stylesheet" href="./assets/css/style.css"/>
</head>
<body>

  <!-- CURSOR -->
  <div class="cursor"      id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- NAV -->
  <nav>
    <a href="#" class="nav-logo" id="nav-logo"></a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="#work">Work</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle light / dark">
        <!-- Moon icon (shown in dark mode) -->
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <!-- Sun icon (shown in light mode) -->
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22"  y1="4.22"  x2="5.64"  y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1"  y1="12" x2="3"  y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36"/>
          <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <div class="nav-dot" id="nav-dot"></div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-grid"></div>
    <div class="hero-content">
      <p class="hero-label" id="hero-label"></p>
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-tagline" id="hero-tagline"></p>
      <div class="hero-actions" id="hero-cta"></div>
    </div>
    <div class="hero-scroll">
      <span>Scroll</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <!-- MARQUEE -->
  <div class="marquee-wrap">
    <div class="marquee-track" id="marquee-track"></div>
  </div>

  <!-- ABOUT -->
  <div class="about-strip fu">
    <div class="about-left">
      <span class="label">About</span>
      <p class="about-text" id="about-text"></p>
    </div>
    <div class="about-right">
      <span class="label">Quick Facts</span>
      <div class="meta-list" id="meta-list"></div>
    </div>
  </div>

  <!-- WORK -->
  <section class="section" id="work">
    <div class="section-head fu">
      <span class="s-num">01</span>
      <h2 class="s-title">Work</h2>
    </div>
    <div id="work-list"></div>
  </section>

  <!-- PROJECTS -->
  <section class="section" id="projects">
    <div class="section-head fu">
      <span class="s-num">02</span>
      <h2 class="s-title">Projects</h2>
    </div>
    <div class="proj-grid fu" id="proj-grid"></div>
  </section>

  <!-- SKILLS -->
  <section class="section" id="skills">
    <div class="section-head fu">
      <span class="s-num">03</span>
      <h2 class="s-title">Skills</h2>
    </div>
    <div class="skill-cols fu" id="skill-cols"></div>

    <div class="fu" style="margin-top:2rem;">
      <span class="label">Languages</span>
      <div class="lang-grid" id="lang-grid"></div>
    </div>
  </section>

  <!-- CONTACT -->
  <div class="contact-sec" id="contact">
    <div class="contact-inner">
      <div class="fu">
        <h2 class="contact-big">Let's build<br>something <em>real.</em></h2>
        <p class="contact-sub" id="contact-sub"></p>
      </div>
      <div class="fu">
        <div class="clinks" id="contact-links"></div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p id="footer-left"></p>
    <p id="footer-right"></p>
  </footer>

  <script src="./assets/js/main.js"></script>
</body>
</html>
